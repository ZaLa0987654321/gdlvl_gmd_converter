<!DOCTYPE html>
<html lang="en">

<head>

<body>
  <h2>.gdlvl to .gmd converter</h2>
  <input type="file" id="file-input" name="filename" accept=".gdlvl">

  <button id="downloadBtn" disabled>Download .GMD</button>

  <hr>

  <h2>.gmd to .gdlvl converter</h2>
  <input type="file" id="file-input2" name="filename" accept=".gmd">
  <p>Result:</p>
  <p id='lvl-name2' style="color: gray; font-size: 1.2rem;">Level: [not loaded yet]</p>
  <p id="preview2" style="background: black; color: white; width: fit-content; max-width: 40%; padding: 0px 10px; word-break: break-all;">[not loaded yet]</p>

  <script src="script.js"></script>
